# CUPS 主配置（容器化：免登录打印、共享、AirPrint）
ServerAlias *
Port 631
Listen /run/cups/cups.sock

Browsing On
BrowseLocalProtocols dnssd
WebInterface Yes
DefaultAuthType Basic
MaxLogSize 0
LogLevel warning

# 允许局域网访问
ReadyPaperSizes A4
<Location />
    Order allow,deny
    Allow all
</Location>

<Location /admin>
    Order allow,deny
    Allow all
</Location>

<Location /admin/conf>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow all
</Location>

<Location /admin/log>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow all
</Location>

<Policy default>
    # 打印作业免认证（局域网 AirPrint / 网页面板）
    <Limit Send-Document Send-URI Hold-Job Release-Job Cancel-Job Set-Job-Attributes Get-Job-Attributes Get-Jobs Subscribe-Events Unsubscribe-Events Get-Notifications Send-Printers Get-Printers>
        Order deny,allow
        Allow all
    </Limit>

    <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Reject-Jobs Accept-Jobs Default-Printer Set-Printer-Attributes Delete-Printer Rename-Printer>
        AuthType Default
        Order deny,allow
        Allow all
    </Limit>

    <Limit All>
        Order deny,allow
        Allow all
    </Limit>
</Policy>
