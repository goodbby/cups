[server]
#host-name=
#domain-name=local
use-ipv4=yes
use-ipv6=no
check-response-ttl=no
use-iff-running=no
enable-dbus=yes
disallow-other-stacks=no
# 不限制网卡（NAS 是 enp4s0、N1 是 eth0，写死网卡名会导致 AirPrint 广播不出去）

[publish]
publish-hinfo=no
publish-workstation=no
publish-aaaa-on-ipv4=no
publish-a-on-ipv6=no

[reflector]
enable-reflector=no
reflect-ipv=no

# 注意：不要启用 [rlimits]（Debian 示例里的 rlimit-as=65536 是给嵌入式设备的，
# 取消注释会导致 avahi 启动时 "Out of memory, aborting" 直接崩溃，AirPrint 失效）
